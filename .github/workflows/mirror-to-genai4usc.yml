name: Mirror to genai4usc frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-to-genai4usc-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main to genai4usc
    runs-on: ubuntu-latest
    if: github.repository == 'SAHAJ-BHADJA/Genai-ed_frontend'
    env:
      TARGET_REPOSITORY: genai4usc-cloud/Frontend_Genai-ed
      TARGET_BRANCH: main
      MIRROR_AUTHOR_NAME: genai4usc-cloud
      MIRROR_AUTHOR_EMAIL: genai4usc-cloud@users.noreply.github.com
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify mirror token access
        env:
          MIRROR_TOKEN: ${{ secrets.GENAI4USC_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          MIRROR_TOKEN="$(printf '%s' "$MIRROR_TOKEN" | tr -d '\r\n[:space:]')"

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing GENAI4USC_MIRROR_TOKEN repository secret." >&2
            exit 1
          fi

          status="$(curl -sS -o /tmp/mirror-repo.json -w '%{http_code}' \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}")"

          if [ "$status" != "200" ]; then
            echo "GENAI4USC_MIRROR_TOKEN cannot access ${TARGET_REPOSITORY}. GitHub API returned HTTP ${status}." >&2
            echo "Create or update the token with resource owner genai4usc-cloud, repository access to Frontend_Genai-ed, and Contents read/write permission." >&2
            cat /tmp/mirror-repo.json >&2
            exit 1
          fi

          echo "Mirror token can access ${TARGET_REPOSITORY}."

      - name: Push rewritten genai4usc-authored mirror commit
        env:
          MIRROR_TOKEN: ${{ secrets.GENAI4USC_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          MIRROR_TOKEN="$(printf '%s' "$MIRROR_TOKEN" | tr -d '\r\n[:space:]')"

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing GENAI4USC_MIRROR_TOKEN repository secret." >&2
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w 0)"
          TARGET_URL="https://github.com/${TARGET_REPOSITORY}.git"
          TARGET_REF="refs/remotes/genai4usc/${TARGET_BRANCH}"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            ls-remote --exit-code "$TARGET_URL" "refs/heads/${TARGET_BRANCH}" >/dev/null
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --depth=1 "$TARGET_URL" "${TARGET_BRANCH}:${TARGET_REF}"

          SOURCE_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          SOURCE_SUBJECT="$(git log -1 --pretty=%s)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          TARGET_HEAD="$(git rev-parse "${TARGET_REF}")"
          MIRROR_MESSAGE="$(printf 'mirror: %s\n\nSource: SAHAJ-BHADJA/Genai-ed_frontend@%s' "$SOURCE_SUBJECT" "$SOURCE_SHA")"

          git config user.name "$MIRROR_AUTHOR_NAME"
          git config user.email "$MIRROR_AUTHOR_EMAIL"

          MIRROR_COMMIT="$(
            GIT_AUTHOR_NAME="$MIRROR_AUTHOR_NAME" \
            GIT_AUTHOR_EMAIL="$MIRROR_AUTHOR_EMAIL" \
            GIT_COMMITTER_NAME="$MIRROR_AUTHOR_NAME" \
            GIT_COMMITTER_EMAIL="$MIRROR_AUTHOR_EMAIL" \
            git commit-tree "$SOURCE_TREE" -p "$TARGET_HEAD" -m "$MIRROR_MESSAGE"
          )"

          echo "Created genai4usc-authored mirror commit ${MIRROR_COMMIT} from source ${SOURCE_SHA}."
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "$TARGET_URL" "${MIRROR_COMMIT}:refs/heads/${TARGET_BRANCH}"
