name: Mirror to genai4usc frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-to-genai4usc-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main to genai4usc
    runs-on: ubuntu-latest
    if: github.repository == 'SAHAJ-BHADJA/Genai-ed_frontend'
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to genai4usc mirror
        env:
          MIRROR_TOKEN: ${{ secrets.GENAI4USC_MIRROR_TOKEN }}
        run: |
          MIRROR_TOKEN="$(printf '%s' "$MIRROR_TOKEN" | tr -d '\r\n[:space:]')"

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing GENAI4USC_MIRROR_TOKEN repository secret." >&2
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$MIRROR_TOKEN" > ~/.git-credentials
          git push "https://github.com/genai4usc-cloud/Frontend_Genai-ed.git" HEAD:main
